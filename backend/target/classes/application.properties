# Port mapping (dynamic for Render, default to 5001)
server.port=${PORT:5001}

# MongoDB configuration (reads MONGO_URI from env with local fallback)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/intuneDB}

# JWT configuration (JWT_SECRET is required; minimum 32 bytes for HS256)
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# Browser origins allowed to call the Spring Boot API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

# External webhook authentication. An empty value disables webhook processing.
app.webhook.secret=${WEBHOOK_SECRET:}

# SBERT AI service matching API URL
ai.similarity.url=${AI_SIMILARITY_URL:http://localhost:8000/api/similarity}
ai.embedding.url=${AI_EMBEDDING_URL:http://localhost:8000/api/embedding}
ai.embedding.similarity.url=${AI_EMBEDDING_SIMILARITY_URL:http://localhost:8000/api/similarity/embeddings}
ai.embedding.model=${AI_EMBEDDING_MODEL:sentence-transformers/all-MiniLM-L6-v2}
matching.top-k=${MATCHING_TOP_K:10}
app.rate-limit.candidates.requests-per-minute=${RATE_LIMIT_CANDIDATES_PER_MINUTE:30}
app.rate-limit.chat.requests-per-minute=${RATE_LIMIT_CHAT_PER_MINUTE:60}
ai.similarity.connect-timeout=${AI_SIMILARITY_CONNECT_TIMEOUT:2s}
ai.similarity.read-timeout=${AI_SIMILARITY_READ_TIMEOUT:15s}

# Disable Spring Security default logging
logging.level.org.springframework.security=INFO
